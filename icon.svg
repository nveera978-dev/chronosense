  <line x1="96" y1="256" x2="120" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <!-- Progress arc -->
  <path d="M 256 100 A 156 156 0 0 1 390 334" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
  <!-- Center elements: Hourglass & Target -->
  <circle cx="256" cy="256" r="16" fill="#10b981" />
  <line x1="256" y1="256" x2="256" y2="150" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="290" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="6" fill="#0f172a" />
