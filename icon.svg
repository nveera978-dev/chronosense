<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Luxury Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Radiant Emerald to Electric Cyan Flow -->
    <linearGradient id="flowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="ringHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Luxury Glass Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Minimalist Dynamic Flow Ring (Continuous Time & Habit Momentum) -->
  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#flowGlow)" stroke-width="28" opacity="0.3" filter="url(#glow)" />
  
  <!-- Outer Track -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,256,0.05)" stroke-width="24"/>

  <!-- Glowing Momentum Arc -->
  <path d="M 256 116 A 140 140 0 1 1 126 312" fill="none" stroke="url(#flowGlow)" stroke-width="26" stroke-linecap="round"/>

  <!-- Core Zenith Dot -->
  <circle cx="256" cy="116" r="15" fill="#ffffff" filter="url(#glow)"/>

  <!-- Center Floating Spark (Focus Pivot) -->
  <circle cx="256" cy="256" r="32" fill="url(#ringHighlight)"/>
  <circle cx="256" cy="256" r="14" fill="#050811"/>
</svg>
