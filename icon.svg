<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="12" fill="none" />
  <!-- Clock ticks -->
  <line x1="256" y1="96" x2="256" y2="120" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="416" y1="256" x2="392" y2="256" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
